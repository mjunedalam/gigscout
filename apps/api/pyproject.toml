[project]
name = "gigscout"
version = "0.2.0"
description = "AI lead scout for software development agencies: finds, qualifies and briefs client project leads."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "chromadb>=1.0",
    "fastembed>=0.5",
    "mlflow>=3.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langchain>=1.0",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "numpy>=1.26",
    "email-validator>=2.1",
    "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
gigscout = "gigscout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gigscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=gigscout --cov-report=term-missing"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query"]
