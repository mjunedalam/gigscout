# GigScout in production: Postgres, the API, the web app behind Caddy (HTTPS), and nightly backups.
#
#   cp deploy/.env.example .env           # then set POSTGRES_PASSWORD and GIGSCOUT_SITE_ADDRESS
#   cp apps/api/.env.example apps/api/.env  # app settings and secrets (admin, SMTP, CRM, ...)
#   docker compose up -d --build
#   docker compose --profile llm up -d     # optional: a local Ollama for the AI agents
#
# See docs/DEPLOY.md.

name: gigscout

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gigscout
      POSTGRES_USER: gigscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigscout -d gigscout"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: apps/api
    restart: unless-stopped
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      GIGSCOUT_DATABASE_URL: postgresql+psycopg://gigscout:${POSTGRES_PASSWORD}@db:5432/gigscout
      GIGSCOUT_COOKIE_SECURE: "true"
      GIGSCOUT_FORWARDED_ALLOW_IPS: "*"  # only Caddy can reach the API (it publishes no port)
      GIGSCOUT_OLLAMA_BASE_URL: ${GIGSCOUT_OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - apidata:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      GIGSCOUT_SITE_ADDRESS: ${GIGSCOUT_SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: gigscout
      PGDATABASE: gigscout
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
    volumes:
      - ./backups:/backups
      - apidata:/appdata:ro
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh", "--daily"]
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.34.4
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  apidata:
  caddy_data:
  caddy_config:
  ollama:
